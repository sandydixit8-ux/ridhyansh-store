<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ridhyansh — Reset</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body class="login-body">

<main class="login-wrap">
  <div class="login-card">
    <div class="login-brand">🛍️ <span>Ridhyansh</span></div>
    <p class="login-sub">Reset se is browser ka saara data clear ho jayega:</p>

    <div class="reset-list">
      <div class="rrow">🔐 <span>Admin username &amp; password → default reset</span></div>
      <div class="rrow">📦 <span>Products → default demo catalog</span></div>
      <div class="rrow">🧾 <span>Orders → cleared</span></div>
      <div class="rrow">⚙️ <span>Settings (UPI, WhatsApp) → default</span></div>
    </div>

    <button class="btn primary full" id="doReset">🧹 Reset karo</button>
    <p class="login-hint" id="rstMsg"></p>
    <a class="login-back" href="login.html">← Back to login</a>
  </div>
</main>

<script src="js/store.js?v=4"></script>
<script src="js/reset.js?v=4"></script>
</body>
</html>
