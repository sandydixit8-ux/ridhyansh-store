<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ridhyansh — Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body class="login-body">

<main class="login-wrap">
  <div class="login-card">
    <div class="login-brand">🛍️ <span>Ridhyansh</span></div>
    <p class="login-sub">Admin se login karo — sirf aap.</p>

    <form id="loginForm" autocomplete="off">
      <label for="luser">Username</label>
      <input type="text" id="luser" placeholder="ridhyansh007" autocomplete="username">
      <label for="lpass">Password</label>
      <input type="password" id="lpass" placeholder="••••••••" autocomplete="current-password">
      <button class="btn primary full" type="submit">Login →</button>
    </form>

    <p class="login-err hidden" id="lerr">Galat username ya password.</p>
    <p class="login-hint">Login: <b>ridhyansh007</b> / <b>admin@123</b> — Admin ke Settings se badla ja sakta hai.</p>
    <a class="login-back" href="index.html">← Back to store</a>
  </div>
</main>

<script src="js/store.js?v=4"></script>
<script src="js/login.js?v=4"></script>
</body>
</html>
