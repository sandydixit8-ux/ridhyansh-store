<!DOCTYPE html>
<html lang="en">
<head>
<script>document.documentElement.classList.add('js');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F5F1EA">
<title>Ridhyansh Store — Admin Login</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=18">
<link rel="stylesheet" href="css/tokens.css?v=1">
<link rel="stylesheet" href="css/ui.css?v=4">
</head>
<body class="login-body">

<main class="login-wrap">
  <h1 class="sr-only">Admin login — Ridhyansh Store</h1>
  <div class="login-card">
    <div class="login-brand">🛍️ <span>Ridhyansh Store</span></div>
    <p class="login-sub">Admin login — only for you.</p>

    <form id="loginForm" autocomplete="off">
      <label for="luser">Username</label>
      <input type="text" id="luser" placeholder="username" autocomplete="username">
      <label for="lpass">Password</label>
      <input type="password" id="lpass" placeholder="••••••••" autocomplete="current-password">
      <button class="btn primary full" type="submit">Login →</button>
    </form>

    <p class="login-err hidden" id="lerr">Incorrect username or password.</p>
    <a class="login-back" href="index.html">← Back to store</a>
  </div>
</main>

<script src="js/store.js?v=23"></script>
<script src="js/login.js?v=19"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@14.1.0/dist/motion.js" defer></script>
<script src="js/ui.js?v=2" defer></script>
</body>
</html>
